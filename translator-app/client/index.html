<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Text Translator</h1>
      <p class="subtitle">Translate text instantly using MyMemory Translation API</p>
    </header>

    <section class="translator-card">
      <div class="lang-row">
        <div class="lang-select">
          <label for="fromLang">From</label>
          <select id="fromLang">
            <option value="auto">Detect language</option>
          </select>
        </div>

        <button id="swapBtn" class="swap-btn" title="Swap languages" aria-label="Swap languages">
          ⇄
        </button>

        <div class="lang-select">
          <label for="toLang">To</label>
          <select id="toLang"></select>
        </div>
      </div>

      <div class="text-row">
        <div class="text-box">
          <textarea id="sourceText" placeholder="Enter text to translate..." maxlength="1000"></textarea>
          <div class="char-count"><span id="charCount">0</span>/1000</div>
        </div>

        <div class="text-box">
          <textarea id="translatedText" placeholder="Translation will appear here..." readonly></textarea>
          <div class="box-actions">
            <button id="copyBtn" class="icon-btn" title="Copy translation">📋 Copy</button>
            <button id="speakBtn" class="icon-btn" title="Listen to translation">🔊 Listen</button>
          </div>
        </div>
      </div>

      <button id="translateBtn" class="translate-btn">Translate</button>
      <p id="statusMsg" class="status-msg"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
